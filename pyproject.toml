# Tooling configuration only: the script itself is not a Python package you install with pip.
# FL Studio loads src/LaunchkeyMK3Full/ directly (see README).
[project]
name = "launchkey-mk3-fl"
version = "0.2.0"
description = "Full FL Studio MIDI controller script for the Novation Launchkey MK3"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
# FL Studio embeds CPython 3.9 (FL 20.9 - 21) / 3.12 (FL 2024+); keep the script 3.9-compatible.
target-version = "py39"
line-length = 120
src = ["src/LaunchkeyMK3Full", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "N"]
ignore = [
    "N802", # FL Studio callbacks are CamelCase (OnInit, OnMidiMsg, ...)
    "N999", # device_LaunchkeyMK3Full.py is the file name FL Studio requires
    "UP031", # %-formatting is fine (and reads well for fixed-width LCD text)
    "SIM105", # plain try/except instead of contextlib keeps FL Studio imports minimal
    "UP006", "UP007", "UP035", "UP045", # no typing syntax newer than 3.9
]

[tool.ruff.lint.per-file-ignores]
# The mock mirrors FL Studio's own (camelCase) function and argument names.
"tests/flmock/*" = ["N802", "N803", "N815", "N816"]

[tool.ruff.lint.isort]
known-first-party = ["lkmk3fl"]
known-third-party = ["device", "midi", "transport", "mixer", "channels", "patterns", "plugins", "ui", "general", "playlist", "utils"]
